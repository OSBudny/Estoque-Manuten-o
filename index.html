<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estoque Manutenção</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#0b1118;
color:#f4f6f8
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#0b1118,#172331);
padding:20px
}
.login{
width:100%;
max-width:420px;
background:#17212c;
border:1px solid #2c3b49;
border-radius:16px;
padding:32px;
box-shadow:0 20px 60px #0008
}
.login h1{margin:0 0 8px}
.login h1 span{color:#ff8c00}
.login p{color:#9ca9b5;margin-bottom:25px}

label{
display:block;
font-size:13px;
color:#c8d0d8;
margin:0 0 7px
}
input,select,textarea{
width:100%;
background:#0e1720;
border:1px solid #30404e;
color:#fff;
border-radius:8px;
padding:11px;
outline:none
}
input:focus,select:focus,textarea:focus{
border-color:#ff8c00
}
.field{margin-bottom:15px}

.btn{
border:0;
border-radius:8px;
padding:11px 15px;
font-weight:bold;
background:#ff8c00;
color:#fff
}
.btn:hover{background:#ffa52e}
.btn.dark{background:#24313e}
.btn.red{background:#8b2d2d}
.btn.green{background:#16794f}
.btn.blue{background:#21699f}

.login-buttons{
display:flex;
gap:10px
}
.login-buttons .btn{flex:1}

#app{
min-height:100vh;
display:flex
}

.sidebar{
width:245px;
position:fixed;
top:0;
bottom:0;
left:0;
background:#101820;
border-right:1px solid #2a3743;
padding:20px 14px
}
.logo{
font-size:22px;
font-weight:bold;
padding:8px 10px 25px
}
.logo span{color:#ff8c00}

.user{
font-size:12px;
color:#aab5bf;
background:#18232e;
border:1px solid #293844;
border-radius:9px;
padding:11px;
margin-bottom:18px;
word-break:break-all
}

.nav{
display:flex;
flex-direction:column;
gap:5px
}
.nav button{
background:transparent;
border:0;
color:#bdc7d0;
padding:12px;
border-radius:8px;
text-align:left
}
.nav button:hover,.nav button.active{
background:#222f3b;
color:#fff
}
.nav button.active{
border-left:3px solid #ff8c00
}

.logout{
position:absolute;
bottom:20px;
left:14px;
right:14px
}

main{
margin-left:245px;
width:calc(100% - 245px);
padding:27px
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px
}
.title{
font-size:28px;
font-weight:bold
}
.subtitle{
font-size:14px;
color:#929faa;
margin-top:5px
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:20px
}
.card{
background:#17212c;
border:1px solid #2b3946;
border-radius:13px;
padding:20px
}
.card small{
color:#929faa
}
.card strong{
display:block;
font-size:29px;
margin-top:10px
}
.orange strong{color:#ff8c00}
.green strong{color:#25c27a}
.red strong{color:#ef5350}
.blue strong{color:#4da3ff}
.yellow strong{color:#f5c542}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px
}

.panel{
background:#17212c;
border:1px solid #2b3946;
border-radius:13px;
padding:20px;
margin-bottom:20px
}
.panel-head{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:16px
}
.panel-title{
font-size:18px;
font-weight:bold
}

.toolbar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px
}
.toolbar input{max-width:380px}

.table-wrap{
overflow:auto
}
table{
width:100%;
border-collapse:collapse;
min-width:800px
}
th,td{
padding:11px 9px;
border-bottom:1px solid #2b3946;
text-align:left;
font-size:13px
}
th{color:#aeb9c2}
tr:hover td{background:#1c2833}

.badge{
padding:5px 8px;
border-radius:20px;
font-size:11px;
font-weight:bold;
display:inline-block
}
.badge.green{background:#164d36;color:#a1f1c9}
.badge.red{background:#572424;color:#ffadad}
.badge.yellow{background:#554b1c;color:#ffe898}
.badge.blue{background:#183e5e;color:#a3d5ff}

.empty{
padding:35px;
text-align:center;
color:#87939e
}

.modal{
position:fixed;
inset:0;
background:#000b;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:100
}
.modal-box{
width:100%;
max-width:750px;
max-height:90vh;
overflow:auto;
background:#17212c;
border:1px solid #344452;
border-radius:15px;
padding:24px
}
.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px
}
.close{
background:transparent;
border:0;
color:#aaa;
font-size:27px
}
.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px
}
.full{grid-column:1/-1}
.modal-actions{
display:flex;
justify-content:flex-end;
gap:10px;
margin-top:20px
}

.stat-line{
display:flex;
justify-content:space-between;
padding:13px 0;
border-bottom:1px solid #2b3946
}

@media(max-width:1000px){
.cards{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
.sidebar{width:70px;padding:15px 7px}
.logo{font-size:0}
.logo span{font-size:20px}
.user{display:none}
.nav button{font-size:0;text-align:center}
.logout{font-size:0}
main{
margin-left:70px;
width:calc(100% - 70px);
padding:15px
}
.cards{grid-template-columns:1fr}
.grid2{grid-template-columns:1fr}
.form-grid{grid-template-columns:1fr}
.full{grid-column:auto}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login">

<div class="login">

<h1>Estoque <span>Manutenção</span></h1>
<p>Controle online de peças e materiais da manutenção</p>

<form id="loginForm">

<div class="field">
<label>E-mail</label>
<input id="email" type="email" required>
</div>

<div class="field">
<label>Senha</label>
<input id="password" type="password" required>
</div>

<div class="login-buttons">
<button class="btn" type="submit">Entrar</button>
<button class="btn dark" type="button" id="signup">Criar acesso</button>
</div>

</form>

<div id="loginMsg"></div>

</div>
</section>


<!-- APLICAÇÃO -->
<section id="app" class="hidden">

<aside class="sidebar">

<div class="logo">
Estoque <span>Manutenção</span>
</div>

<div class="user">
Usuário:<br>
<strong id="userEmail"></strong>
</div>

<nav class="nav">

<button class="active" data-page="dashboard">
📊 Dashboard
</button>

<button data-page="parts">
🔩 Peças
</button>

<button data-page="movements">
📦 Movimentações
</button>

<button data-page="critical">
🚨 Estoque crítico
</button>

<button data-page="indicators">
📈 Indicadores
</button>

</nav>

<button id="logout" class="btn red logout">
Sair
</button>

</aside>


<main>

<div class="header">

<div>
<div id="title" class="title">Dashboard</div>
<div id="subtitle" class="subtitle">
Visão geral do estoque de manutenção
</div>
</div>

<button class="btn dark" id="refresh">
↻ Atualizar
</button>

</div>

<div id="content"></div>

</main>

</section>


<!-- MODAL PEÇA -->
<div id="partModal" class="modal hidden">

<div class="modal-box">

<div class="modal-head">
<div class="panel-title" id="partTitle">Nova peça</div>
<button class="close" onclick="closePart()">×</button>
</div>

<form id="partForm">

<input type="hidden" id="partId">

<div class="form-grid">

<div>
<label>Código *</label>
<input id="code" required>
</div>

<div>
<label>Descrição *</label>
<input id="description" required>
</div>

<div>
<label>Categoria</label>
<select id="category"></select>
</div>

<div>
<label>Localização</label>
<select id="location"></select>
</div>

<div>
<label>Unidade</label>
<input id="unit" value="UN">
</div>

<div>
<label>Custo unitário</label>
<input id="cost" type="number" min="0" step="0.01" value="0">
</div>

<div>
<label>Estoque mínimo</label>
<input id="minimum" type="number" min="0" step="0.01" value="0">
</div>

<div>
<label>Estoque máximo</label>
<input id="maximum" type="number" min="0" step="0.01" value="0">
</div>

<div>
<label>Ponto de reposição</label>
<input id="reorder" type="number" min="0" step="0.01" value="0">
</div>

<div>
<label>Criticidade</label>
<select id="criticality">
<option>Crítica</option>
<option>Alta</option>
<option selected>Média</option>
<option>Baixa</option>
</select>
</div>

</div>

<div class="modal-actions">
<button type="button" class="btn dark" onclick="closePart()">Cancelar</button>
<button class="btn" type="submit">Salvar peça</button>
</div>

</form>

</div>
</div>


<!-- MODAL MOVIMENTAÇÃO -->
<div id="movementModal" class="modal hidden">

<div class="modal-box">

<div class="modal-head">
<div class="panel-title">Nova movimentação</div>
<button class="close" onclick="closeMovement()">×</button>
</div>

<form id="movementForm">

<div class="form-grid">

<div class="full">
<label>Peça *</label>
<select id="movementPart" required></select>
</div>

<div>
<label>Tipo *</label>
<select id="movementType">
<option value="Entrada">Entrada</option>
<option value="Saída">Saída</option>
<option value="Devolução">Devolução</option>
<option value="Ajuste">Ajuste</option>
</select>
</div>

<div>
<label>Quantidade *</label>
<input id="quantity" type="number" min="0.01" step="0.01" required>
</div>

<div>
<label>Custo unitário</label>
<input id="movementCost" type="number" min="0" step="0.01" value="0">
</div>

<div>
<label>Documento</label>
<input id="document">
</div>

<div>
<label>Equipamento</label>
<input id="equipment">
</div>

<div>
<label>Ordem de manutenção</label>
<input id="order">
</div>

<div>
<label>Motivo</label>
<input id="reason">
</div>

</div>

<div class="modal-actions">
<button type="button" class="btn dark" onclick="closeMovement()">Cancelar</button>
<button class="btn" type="submit">Registrar</button>
</div>

</form>

</div>
</div>


<script>

const SUPABASE_URL="https://uhtmkrlouzbdirkaolet.supabase.co";

const SUPABASE_KEY="sb_publishable_MefMlR2RVIdGv-j9pPqGgw_X72XOvdS";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let user=null;
let parts=[];
let categories=[];
let locations=[];
let movements=[];


/* LOGIN */

loginForm.addEventListener("submit",async e=>{

e.preventDefault();

const {data,error}=await db.auth.signInWithPassword({
email:email.value.trim(),
password:password.value
});

if(error){
loginMsg.innerHTML=
"<p style='color:#ff9999'>Erro: "+escape(error.message)+"</p>";
return;
}

user=data.user;

await start();

});


signup.addEventListener("click",async()=>{

const e=prompt("Digite o e-mail:");

if(!e)return;

const p=prompt("Digite a senha:");

if(!p)return;

if(p.length<6){
alert("A senha precisa ter pelo menos 6 caracteres.");
return;
}

const {error}=await db.auth.signUp({
email:e,
password:p
});

if(error)
alert("Erro: "+error.message);
else
alert("Acesso criado. Se solicitado, confirme o e-mail.");

});


logout.addEventListener("click",async()=>{

await db.auth.signOut();

location.reload();

});


async function check(){

const {data}=await db.auth.getSession();

if(data.session){

user=data.session.user;

await start();

}

}


async function start(){

login.classList.add("hidden");
app.classList.remove("hidden");

userEmail.textContent=user.email;

await load();

showPage("dashboard");

}


db.auth.onAuthStateChange((event,session)=>{

if(session)
user=session.user;

});


/* DADOS */

async function load(){

await Promise.all([
loadParts(),
loadCategories(),
loadLocations(),
loadMovements()
]);

}


async function loadParts(){

const r=await db
.from("parts")
.select("*,categories(name),locations(name)")
.order("description");

if(r.error){

console.error(r.error);
alert("Erro ao carregar peças: "+r.error.message);
return;

}

parts=r.data||[];

}


async function loadCategories(){

const r=await db
.from("categories")
.select("*")
.eq("active",true)
.order("name");

if(!r.error)
categories=r.data||[];

}


async function loadLocations(){

const r=await db
.from("locations")
.select("*")
.eq("active",true)
.order("name");

if(!r.error)
locations=r.data||[];

}


async function loadMovements(){

const r=await db
.from("stock_movements")
.select("*,parts(code,description)")
.order("movement_date",{ascending:false})
.limit(500);

if(!r.error)
movements=r.data||[];

}


/* NAVEGAÇÃO */

document.querySelectorAll(".nav button")
.forEach(b=>{

b.addEventListener("click",()=>{

document.querySelectorAll(".nav button")
.forEach(x=>x.classList.remove("active"));

b.classList.add("active");

showPage(b.dataset.page);

});

});


function showPage(page){

const names={
dashboard:["Dashboard","Visão geral do estoque de manutenção"],
parts:["Peças","Cadastro e controle do estoque"],
movements:["Movimentações","Entradas, saídas, devoluções e ajustes"],
critical:["Estoque crítico","Itens que precisam de atenção"],
indicators:["Indicadores","Análise geral do estoque"]
};

title.textContent=names[page][0];
subtitle.textContent=names[page][1];

if(page==="dashboard")dashboard();
if(page==="parts")partsPage();
if(page==="movements")movementsPage();
if(page==="critical")criticalPage();
if(page==="indicators")indicatorsPage();

}


/* DASHBOARD */

function dashboard(){

const total=parts.length;

const quantity=parts.reduce(
(s,p)=>s+num(p.current_stock),0
);

const critical=parts.filter(
p=>num(p.current_stock)<=num(p.min_stock)
).length;

const reorder=parts.filter(p=>
num(p.current_stock)>num(p.min_stock)&&
num(p.reorder_point)>0&&
num(p.current_stock)<=num(p.reorder_point)
).length;

const value=parts.reduce(
(s,p)=>s+num(p.current_stock)*num(p.unit_cost),0
);

const entradas=movements
.filter(m=>m.movement_type==="Entrada")
.reduce((s,m)=>s+num(m.quantity),0);

const saidas=movements
.filter(m=>m.movement_type==="Saída")
.reduce((s,m)=>s+num(m.quantity),0);


content.innerHTML=`

<div class="cards">

<div class="card orange">
<small>Peças cadastradas</small>
<strong>${total}</strong>
</div>

<div class="card blue">
<small>Quantidade em estoque</small>
<strong>${fmt(quantity)}</strong>
</div>

<div class="card red">
<small>Estoque crítico</small>
<strong>${critical}</strong>
</div>

<div class="card green">
<small>Valor do estoque</small>
<strong>${money(value)}</strong>
</div>

</div>


<div class="cards">

<div class="card yellow">
<small>Itens para reposição</small>
<strong>${reorder}</strong>
</div>

<div class="card green">
<small>Total de entradas</small>
<strong>${fmt(entradas)}</strong>
</div>

<div class="card red">
<small>Total de saídas</small>
<strong>${fmt(saidas)}</strong>
</div>

<div class="card blue">
<small>Movimentações</small>
<strong>${movements.length}</strong>
</div>

</div>


<div class="grid2">

<div class="panel">

<div class="panel-head">
<div class="panel-title">Estoque crítico</div>
<button class="btn red" onclick="showPage('critical')">
Ver
</button>
</div>

${criticalTable(5)}

</div>


<div class="panel">

<div class="panel-head">
<div class="panel-title">Últimas movimentações</div>
<button class="btn dark" onclick="showPage('movements')">
Ver todas
</button>
</div>

${movementTable(6)}

</div>

</div>

`;

}


/* PEÇAS */

function partsPage(){

content.innerHTML=`

<div class="panel">

<div class="panel-head">

<div class="panel-title">Peças cadastradas</div>

<button class="btn" onclick="openPart()">
+ Nova peça
</button>

</div>

<div class="toolbar">

<input
id="search"
placeholder="Pesquisar código ou descrição..."
oninput="filterParts()">

</div>

<div id="partsTable">
${partsTable(parts)}
</div>

</div>

`;

}


function partsTable(list){

if(!list.length)
return `<div class="empty">Nenhuma peça cadastrada.</div>`;

return`

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Código</th>
<th>Descrição</th>
<th>Categoria</th>
<th>Local</th>
<th>Estoque</th>
<th>Mínimo</th>
<th>Reposição</th>
<th>Custo</th>
<th>Status</th>
<th></th>
</tr>
</thead>

<tbody>

${list.map(p=>{

const stock=num(p.current_stock);
const min=num(p.min_stock);
const rep=num(p.reorder_point);

let status='<span class="badge green">Normal</span>';

if(stock<=min)
status='<span class="badge red">Crítico</span>';
else if(rep>0&&stock<=rep)
status='<span class="badge yellow">Repor</span>';

return`

<tr>

<td><strong>${escape(p.code)}</strong></td>

<td>${escape(p.description)}</td>

<td>${escape(p.categories?.name||"-")}</td>

<td>${escape(p.locations?.name||"-")}</td>

<td><strong>${fmt(stock)}</strong> ${escape(p.unit||"")}</td>

<td>${fmt(min)}</td>

<td>${fmt(rep)}</td>

<td>${money(p.unit_cost)}</td>

<td>${status}</td>

<td>
<button class="btn dark" onclick="editPart('${p.id}')">
Editar
</button>
</td>

</tr>

`;

}).join("")}

</tbody>

</table>

</div>

`;

}


function filterParts(){

const q=document.getElementById("search").value.toLowerCase();

const list=parts.filter(p=>
String(p.code||"").toLowerCase().includes(q)||
String(p.description||"").toLowerCase().includes(q)
);

document.getElementById("partsTable").innerHTML=partsTable(list);

}


/* MODAL PEÇA */

function populatePart(){

category.innerHTML=
'<option value="">Selecione...</option>'+
categories.map(c=>
`<option value="${c.id}">${escape(c.name)}</option>`
).join("");

location.innerHTML=
'<option value="">Selecione...</option>'+
locations.map(l=>
`<option value="${l.id}">${escape(l.name)}</option>`
).join("");

}


function openPart(id=null){

populatePart();

partModal.classList.remove("hidden");

partForm.reset();

partId.value="";

unit.value="UN";

partTitle.textContent=id?"Editar peça":"Nova peça";

if(id){

const p=parts.find(x=>x.id===id);

if(!p)return;

partId.value=p.id;
code.value=p.code||"";
description.value=p.description||"";
category.value=p.category_id||"";
location.value=p.location_id||"";
unit.value=p.unit||"UN";
cost.value=p.unit_cost||0;
minimum.value=p.min_stock||0;
maximum.value=p.max_stock||0;
reorder.value=p.reorder_point||0;
criticality.value=p.criticality||"Média";

}

}


function editPart(id){
openPart(id);
}


function closePart(){
partModal.classList.add("hidden");
}


partForm.addEventListener("submit",async e=>{

e.preventDefault();

const id=partId.value;

const payload={
code:code.value.trim(),
description:description.value.trim(),
category_id:category.value||null,
location_id:location.value||null,
unit:unit.value.trim()||"UN",
unit_cost:num(cost.value),
min_stock:num(minimum.value),
max_stock:num(maximum.value),
reorder_point:num(reorder.value),
criticality:criticality.value,
updated_at:new Date().toISOString()
};

let r;

if(id){

r=await db.from("parts").update(payload).eq("id",id);

}else{

payload.current_stock=0;

r=await db.from("parts").insert(payload);

}

if(r.error){

alert("Erro ao salvar:\n"+r.error.message);
return;

}

closePart();

await load();

partsPage();

});


/* MOVIMENTAÇÕES */

function movementsPage(){

content.innerHTML=`

<div class="panel">

<div class="panel-head">

<div class="panel-title">Movimentações</div>

<button class="btn" onclick="openMovement()">
+ Nova movimentação
</button>

</div>

<div class="toolbar">

<input
id="movementSearch"
placeholder="Pesquisar peça..."
oninput="filterMovements()">

</div>

<div id="movementTable">
${movementTable()}
</div>

</div>

`;

}


function movementTable(limit=null){

let list=[...movements];

if(limit)list=list.slice(0,limit);

if(!list.length)
return `<div class="empty">Nenhuma movimentação registrada.</div>`;

return`

function filterMovements(){

const q=document
.getElementById("movementSearch")
.value.toLowerCase();

const list=movements.filter(m=>
String(m.parts?.code||"").toLowerCase().includes(q)||
String(m.parts?.description||"").toLowerCase().includes(q)
);

document.getElementById("movementTable")
.innerHTML=movementTableFrom(list);

}


function movementTableFrom(list){

if(!list.length)
return `<div class="empty">Nenhuma movimentação encontrada.</div>`;

const old=movements;
movements=list;
const html=movementTable();
movements=old;

return html;

}


/* MODAL MOVIMENTAÇÃO */

function openMovement(){

movementModal.classList.remove("hidden");

movementForm.reset();

movementPart.innerHTML=
'<option value="">Selecione a peça...</option>'+
parts.map(p=>
`<option value="${p.id}">
${escape(p.code)} - ${escape(p.description)}
</option>`
).join("");

}


function closeMovement(){
movementModal.classList.add("hidden");
}


movementForm.addEventListener("submit",async e=>{

e.preventDefault();

const partIdValue=movementPart.value;

const type=movementType.value;

const qty=num(quantity.value);

const p=parts.find(x=>x.id===partIdValue);

if(!p){

alert("Selecione uma peça.");
return;

}

if(qty<=0){

alert("Informe uma quantidade válida.");
return;

}

const before=num(p.current_stock);

let after=before;

if(type==="Entrada"||type==="Devolução")
after=before+qty;

if(type==="Saída")
after=before-qty;

if(type==="Ajuste")
after=qty;

if(after<0){

alert("A saída não pode deixar o estoque negativo.");
return;

}


const movement={

part_id:partIdValue,

movement_type:type,

quantity:qty,

unit_cost:num(movementCost.value)||num(p.unit_cost),

stock_before:before,

stock_after:after,

document_number:document.getElementById("document").value.trim()||null,

equipment:equipment.value.trim()||null,

maintenance_order:order.value.trim()||null,

reason:reason.value.trim()||null,

created_by:user?.id||null,

movement_date:new Date().toISOString()

};


const r=await db
.from("stock_movements")
.insert(movement);

if(r.error){

alert("Erro ao registrar movimentação:\n"+r.error.message);
return;

}


const u=await db
.from("parts")
.update({
current_stock:after,
updated_at:new Date().toISOString()
})
.eq("id",partIdValue);


if(u.error){

alert(
"A movimentação foi registrada, mas houve erro ao atualizar o estoque:\n"+
u.error.message
);

return;

}


closeMovement();

await load();

showPage("movements");

alert("Movimentação registrada com sucesso.");

});


/* CRÍTICO */

function criticalPage(){

const critical=parts.filter(p=>
num(p.current_stock)<=num(p.min_stock)
);

content.innerHTML=`

<div class="panel">

<div class="panel-title">
🚨 Peças abaixo ou no estoque mínimo
</div>
</div>

${criticalTable(null,critical)}

</div>

`;

}


function criticalTable(limit=null,list=null){

let arr=list||parts.filter(p=>
num(p.current_stock)<=num(p.min_stock)
);

if(limit)
arr=arr.slice(0,limit);

if(!arr.length)
return `<div class="empty">✅ Nenhum item crítico.</div>`;

return`

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Código</th>
<th>Descrição</th>
<th>Estoque</th>
<th>Mínimo</th>
<th>Diferença</th>
<th>Status</th>
</tr>
</thead>

<tbody>

${arr.map(p=>{

const s=num(p.current_stock);
const m=num(p.min_stock);

return`

<tr>

<td><strong>${escape(p.code)}</strong></td>
<td>${escape(p.description)}</td>
<td>${fmt(s)}</td>
<td>${fmt(m)}</td>
<td>${fmt(s-m)}</td>
<td><span class="badge red">CRÍTICO</span></td>

</tr>

`;

}).join("")}

</tbody>

</table>

</div>

`;

}

/* FORMATAÇÃO */

function num(v){
const n=Number(v);
return Number.isFinite(n)?n:0;
}

function fmt(v){
return num(v).toLocaleString("pt-BR",{
maximumFractionDigits:2
});
}

function money(v){
return num(v).toLocaleString("pt-BR",{
style:"currency",
currency:"BRL"
});
}

function date(v){
if(!v)return"-";
return new Date(v).toLocaleString("pt-BR");
}

function escape(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}
