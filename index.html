<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque Manutenção</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0b1016;
  --bg2:#111923;
  --card:#17212d;
  --card2:#1d2936;
  --border:#2d3b49;
  --orange:#ff8c00;
  --orange2:#ffad42;
  --text:#f5f7fa;
  --muted:#9eabb8;
  --green:#25c27a;
  --red:#ef5350;
  --yellow:#f5c542;
  --blue:#4da3ff;
}

*{
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top right,#1d2b39 0,#0b1016 45%);
}

.login-box{
  width:100%;
  max-width:430px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:34px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
  font-size:27px;
  font-weight:bold;
  margin-bottom:8px;
}

.logo span{
  color:var(--orange);
}

.subtitle{
  color:var(--muted);
  margin-bottom:28px;
}

.field{
  margin-bottom:16px;
}

label{
  display:block;
  font-size:13px;
  color:#c8d0d8;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  background:#101821;
  color:white;
  padding:12px 13px;
  border-radius:9px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--orange);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  border:0;
  border-radius:9px;
  padding:12px 16px;
  color:white;
  font-weight:bold;
  background:var(--orange);
}

.btn:hover{
  background:var(--orange2);
}

.btn.secondary{
  background:#202d3a;
  border:1px solid var(--border);
}

.btn.danger{
  background:#7e2828;
}

.btn.green{
  background:#167c50;
}

.btn.blue{
  background:#236da8;
}

.login-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.login-actions .btn{
  flex:1;
}

.message{
  margin-top:15px;
  padding:11px;
  border-radius:8px;
  font-size:13px;
  display:none;
}

.message.error{
  display:block;
  background:#4b2020;
  color:#ffb5b5;
}

.message.success{
  display:block;
  background:#173f2e;
  color:#a9f0cb;
}

/* APP */

#app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:245px;
  background:#101720;
  border-right:1px solid var(--border);
  min-height:100vh;
  padding:22px 15px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:10;
}

.brand{
  padding:8px 12px 28px;
  font-size:22px;
  font-weight:bold;
}

.brand span{
  color:var(--orange);
}

.user-box{
  background:#17212d;
  border:1px solid var(--border);
  padding:12px;
  border-radius:10px;
  margin-bottom:20px;
  font-size:12px;
  color:var(--muted);
  word-break:break-all;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  background:transparent;
  color:#c5ced7;
  border:0;
  text-align:left;
  padding:12px;
  border-radius:8px;
  font-size:14px;
}

.nav button:hover,
.nav button.active{
  background:#222e3b;
  color:white;
}

.nav button.active{
  border-left:3px solid var(--orange);
}

.logout{
  position:absolute;
  bottom:20px;
  left:15px;
  right:15px;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
  padding:28px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  gap:15px;
}

.page-title{
  font-size:28px;
  font-weight:bold;
}

.page-subtitle{
  color:var(--muted);
  margin-top:5px;
  font-size:14px;
}

.content{
  width:100%;
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px;
}

.card-title{
  color:var(--muted);
  font-size:13px;
  margin-bottom:10px;
}

.card-value{
  font-size:29px;
  font-weight:bold;
}

.card.orange .card-value{
  color:var(--orange);
}

.card.green .card-value{
  color:var(--green);
}

.card.red .card-value{
  color:var(--red);
}

.card.blue .card-value{
  color:var(--blue);
}

/* TABLE */

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px;
  margin-bottom:20px;
}

.panel-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:17px;
}

.panel-title{
  font-size:18px;
  font-weight:bold;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.toolbar input{
  max-width:350px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,
td{
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px;
}

th{
  color:#b9c3cc;
  font-weight:bold;
}

td{
  color:#e7ebef;
}

tr:hover td{
  background:#1b2632;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge.green{
  background:#164d36;
  color:#9cf0c5;
}

.badge.red{
  background:#542323;
  color:#ffaaaa;
}

.badge.yellow{
  background:#564b1c;
  color:#ffe995;
}

.badge.blue{
  background:#183e5e;
  color:#9dd3ff;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:720px;
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:25px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:transparent;
  color:#aaa;
  font-size:25px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.form-full{
  grid-column:1/-1;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
}

/* RESPONSIVE */

@media(max-width:1000px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:700px){
  .sidebar{
    width:70px;
    padding:15px 8px;
  }

  .brand{
    font-size:0;
    padding:10px;
  }

  .brand span{
    font-size:22px;
  }

  .user-box{
    display:none;
  }

  .nav button{
    font-size:0;
    text-align:center;
  }

  .nav button::first-letter{
    font-size:20px;
  }

  .logout{
    font-size:0;
  }

  .main{
    margin-left:70px;
    width:calc(100% - 70px);
    padding:15px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">

  <div class="login-box">

    <div class="logo">
      Estoque <span>Manutenção</span>
    </div>

    <div class="subtitle">
      Sistema online de controle de estoque de peças
    </div>

    <form id="loginForm">

      <div class="field">
        <label>E-mail</label>
        <input id="loginEmail" type="email" required>
      </div>

      <div class="field">
        <label>Senha</label>
        <input id="loginPassword" type="password" required>
      </div>

      <div class="login-actions">
        <button class="btn" type="submit">Entrar</button>
        <button class="btn secondary" type="button" id="showSignup">
          Criar acesso
        </button>
      </div>

    </form>

    <div id="loginMessage" class="message"></div>

  </div>

</section>


<!-- APLICAÇÃO -->

<section id="app" class="hidden">

  <aside class="sidebar">

    <div class="brand">
      Estoque <span>Manutenção</span>
    </div>

    <div class="user-box">
      Usuário conectado:
      <br>
      <strong id="userEmail"></strong>
    </div>

    <nav class="nav">

      <button class="active" data-page="dashboard">
        📊 Dashboard
      </button>

      <button data-page="parts">
        🔩 Peças
      </button>

      <button data-page="movements">
        📦 Movimentações
      </button>

      <button data-page="critical">
        🚨 Estoque crítico
      </button>

      <button data-page="indicators">
        📈 Indicadores
      </button>

    </nav>

    <button id="logoutBtn" class="btn danger logout">
      Sair
    </button>

  </aside>


  <main class="main">

    <div class="topbar">

      <div>
        <div id="pageTitle" class="page-title">
          Dashboard
        </div>

        <div id="pageSubtitle" class="page-subtitle">
          Visão geral do estoque de manutenção
        </div>
      </div>

      <button id="refreshBtn" class="btn secondary">
        ↻ Atualizar
      </button>

    </div>

    <div id="content" class="content"></div>

  </main>

</section>


<!-- MODAL PEÇA -->

<div id="partModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-header">

      <div class="panel-title" id="partModalTitle">
        Nova peça
      </div>

      <button class="close" onclick="closePartModal()">×</button>

    </div>

    <form id="partForm">

      <input type="hidden" id="partId">

      <div class="form-grid">

        <div>
          <label>Código *</label>
          <input id="partCode" required>
        </div>

        <div>
          <label>Descrição *</label>
          <input id="partDescription" required>
        </div>

        <div>
          <label>Categoria</label>
          <select id="partCategory"></select>
        </div>

        <div>
          <label>Localização</label>
          <select id="partLocation"></select>
        </div>

        <div>
          <label>Unidade</label>
          <input id="partUnit" value="UN">
        </div>

        <div>
          <label>Custo unitário</label>
          <input id="partCost" type="number" step="0.01" min="0" value="0">
        </div>

        <div>
          <label>Estoque mínimo</label>
          <input id="partMin" type="number" step="0.01" min="0" value="0">
        </div>

        <div>
          <label>Estoque máximo</label>
          <input id="partMax" type="number" step="0.01" min="0" value="0">
        </div>

        <div>
          <label>Ponto de reposição</label>
          <input id="partReorder" type="number" step="0.01" min="0" value="0">
        </div>

        <div>
          <label>Criticidade</label>
          <select id="partCriticality">
            <option>Crítica</option>
            <option>Alta</option>
            <option selected>Média</option>
            <option>Baixa</option>
          </select>
        </div>

      </div>

      <div class="modal-actions">

        <button type="button" class="btn secondary" onclick="closePartModal()">
          Cancelar
        </button>

        <button type="submit" class="btn">
          Salvar peça
        </button>

      </div>

    </form>

  </div>

</div>


<!-- MODAL MOVIMENTAÇÃO -->

<div id="movementModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-header">

      <div class="panel-title">
        Nova movimentação
      </div>

      <button class="close" onclick="closeMovementModal()">×</button>

    </div>

    <form id="movementForm">

      <div class="form-grid">

        <div class="form-full">
          <label>Peça *</label>
          <select id="movementPart" required></select>
        </div>

        <div>
          <label>Tipo *</label>
          <select id="movementType" required>
            <option value="Entrada">Entrada</option>
            <option value="Saída">Saída</option>
            <option value="Devolução">Devolução</option>
            <option value="Ajuste">Ajuste</option>
          </select>
        </div>

        <div>
          <label>Quantidade *</label>
          <input id="movementQuantity" type="number" min="0.01" step="0.01" required>
        </div>

        <div>
          <label>Custo unitário</label>
          <input id="movementCost" type="number" min="0" step="0.01" value="0">
        </div>

        <div>
          <label>Número do documento</label>
          <input id="movementDocument">
        </div>

        <div>
          <label>Equipamento</label>
          <input id="movementEquipment">
        </div>

        <div>
          <label>Ordem de manutenção</label>
          <input id="movementOrder">
        </div>

        <div>
          <label>Motivo</label>
          <input id="movementReason">
        </div>

      </div>

      <div class="modal-actions">

        <button type="button" class="btn secondary" onclick="closeMovementModal()">
          Cancelar
        </button>

        <button type="submit" class="btn">
          Registrar movimentação
        </button>

      </div>

    </form>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://uhtmkrlouzbdirkaolet.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_MefMlR2RVIdGv-j9pPqGgw_X72XOvdS";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ESTADO
========================================================= */

let currentUser = null;
let parts = [];
let categories = [];
let locations = [];
let movements = [];


/* =========================================================
   ELEMENTOS
========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const content =
  document.getElementById("content");

const loginMessage =
  document.getElementById("loginMessage");


/* =========================================================
   MENSAGENS
========================================================= */

function showLoginMessage(text,type="error"){

  loginMessage.textContent = text;
  loginMessage.className =
    "message " + type;

}

function clearLoginMessage(){

  loginMessage.textContent = "";
  loginMessage.className = "message";

}


/* =========================================================
   LOGIN
========================================================= */

document
.getElementById("loginForm")
.addEventListener("submit",async e=>{

  e.preventDefault();

  clearLoginMessage();

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    showLoginMessage(
      "Não foi possível entrar: " + error.message
    );

    return;
  }

  currentUser = data.user;

  openApplication();

});


/* =========================================================
   CADASTRO
========================================================= */

document
.getElementById("showSignup")
.addEventListener("click",async()=>{

  const email =
    prompt("Digite o e-mail que será usado no sistema:");

  if(!email) return;

  const password =
    prompt("Digite uma senha com pelo menos 6 caracteres:");

  if(!password) return;

  if(password.length < 6){

    showLoginMessage(
      "A senha precisa ter pelo menos 6 caracteres."
    );

    return;
  }

  const {error} =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if(error){

    showLoginMessage(
      "Erro ao criar acesso: " + error.message
    );

    return;
  }

  showLoginMessage(
    "Acesso criado. Se o Supabase solicitar confirmação do e-mail, confirme antes de entrar.",
    "success"
  );

});


/* =========================================================
   SESSÃO
========================================================= */

async function checkSession(){

  const {data} =
    await supabaseClient.auth.getSession();

  if(data.session){

    currentUser = data.session.user;

    openApplication();

  }

}


supabaseClient.auth.onAuthStateChange(
  (event,session)=>{

    if(session){

      currentUser = session.user;

    }

  }
);


/* =========================================================
   ABRIR APLICAÇÃO
========================================================= */

async function openApplication(){

  loginScreen.classList.add("hidden");
  app.classList.remove("hidden");

  document.getElementById("userEmail").textContent =
    currentUser?.email || "";

  await loadAll();

  showPage("dashboard");

}


/* =========================================================
   LOGOUT
========================================================= */

document
.getElementById("logoutBtn")
.addEventListener("click",async()=>{

  await supabaseClient.auth.signOut();

  currentUser = null;

  app.classList.add("hidden");
  loginScreen.classList.remove("hidden");

});


/* =========================================================
   CARREGAMENTO
========================================================= */

async function loadAll(){

  await Promise.all([
    loadParts(),
    loadCategories(),
    loadLocations(),
    loadMovements()
  ]);

}


/* =========================================================
   PEÇAS
========================================================= */

async function loadParts(){

  const {data,error} =
    await supabaseClient
      .from("parts")
      .select(`
        *,
        categories(name),
        locations(name)
      `)
      .order("description");

  if(error){

    console.error(error);

    alert(
      "Erro ao carregar peças: " +
      error.message
    );

    return;
  }

  parts = data || [];

}


/* =========================================================
   CATEGORIAS
========================================================= */

async function loadCategories(){

  const {data,error} =
    await supabaseClient
      .from("categories")
      .select("*")
      .eq("active",true)
      .order("name");

  if(error){

    console.error(error);

    return;
  }

  categories = data || [];

}


/* =========================================================
   LOCAIS
========================================================= */

async function loadLocations(){

  const {data,error} =
    await supabaseClient
      .from("locations")
      .select("*")
      .eq("active",true)
      .order("name");

  if(error){

    console.error(error);

    return;
  }

  locations = data || [];

}


/* =========================================================
   MOVIMENTAÇÕES
========================================================= */

async function loadMovements(){

  const {data,error} =
    await supabaseClient
      .from("stock_movements")
      .select(`
        *,
        parts(code,description)
      `)
      .order("movement_date",{ascending:false})
      .limit(500);

  if(error){

    console.error(error);

    return;
  }

  movements = data || [];

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

document
.querySelectorAll(".nav button")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".nav button")
      .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    showPage(button.dataset.page);

  });

});


function showPage(page){

  const titles = {

    dashboard:[
      "Dashboard",
      "Visão geral do estoque de manutenção"
    ],

    parts:[
      "Peças",
      "Cadastro e consulta das peças"
    ],

    movements:[
      "Movimentações",
      "Entradas, saídas, devoluções e ajustes"
    ],

    critical:[
      "Estoque crítico",
      "Peças que precisam de atenção"
    ],

    indicators:[
      "Indicadores",
      "Indicadores gerais do estoque"
    ]

  };

  document.getElementById("pageTitle").textContent =
    titles[page][0];

  document.getElementById("pageSubtitle").textContent =
    titles[page][1];

  if(page==="dashboard")
    renderDashboard();

  if(page==="parts")
    renderParts();

  if(page==="movements")
    renderMovements();

  if(page==="critical")
    renderCritical();

  if(page==="indicators")
    renderIndicators();

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

  const totalParts =
    parts.length;

  const totalStock =
    parts.reduce(
      (sum,p)=>sum+Number(p.current_stock||0),
      0
    );

  const critical =
    parts.filter(
      p=>Number(p.current_stock||0)
       <= Number(p.min_stock||0)
    ).length;

  const stockValue =
    parts.reduce(
      (sum,p)=>
        sum +
        Number(p.current_stock||0) *
        Number(p.unit_cost||0),
      0
    );

  content.innerHTML = `

    <div class="cards">

      <div class="card orange">
        <div class="card-title">Peças cadastradas</div>
        <div class="card-value">${totalParts}</div>
      </div>

      <div class="card blue">
        <div class="card-title">Quantidade em estoque</div>
        <div class="card-value">${formatNumber(totalStock)}</div>
      </div>

      <div class="card red">
        <div class="card-title">Estoque crítico</div>
        <div class="card-value">${critical}</div>
      </div>

      <div class="card green">
        <div class="card-title">Valor do estoque</div>
        <div class="card-value">${formatMoney(stockValue)}</div>
      </div>

    </div>

    <div class="panel">

/* =========================================================
   PEÇAS
========================================================= */

function renderParts(){

  content.innerHTML = `

    <div class="panel">

      <div class="panel-header">

        <div class="panel-title">
          Cadastro de peças
        </div>

        <button class="btn"
          onclick="openPartModal()">
          + Nova peça
        </button>

      </div>

      <div class="toolbar">

        <input
          id="partSearch"
          placeholder="Pesquisar código ou descrição..."
          oninput="filterParts()">

      </div>

      <div id="partsTableContainer">
        ${renderPartsTable()}
      </div>

    </div>

  `;

}


function renderPartsTable(limit=null){

  let list = [...parts];

  if(limit)
    list = list.slice(0,limit);

  if(!list.length){

    return `
      <div class="empty">
        Nenhuma peça encontrada.
      </div>
    `;

  }

  return `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Localização</th>
            <th>Estoque</th>
            <th>Mínimo</th>
            <th>Custo</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>

        </thead>

        <tbody>

          ${list.map(p=>{

            const stock =
              Number(p.current_stock||0);

            const min =
              Number(p.min_stock||0);

            let status =
              '<span class="badge green">Normal</span>';

            if(stock<=min){

              status =
                '<span class="badge red">Crítico</span>';

            }
            else if(
              Number(p.reorder_point||0)>0 &&
              stock<=Number(p.reorder_point)
            ){

              status =
                '<span class="badge yellow">Repor</span>';

            }

            return `

              <tr>

                <td><strong>${escapeHtml(p.code)}</strong></td>

                <td>${escapeHtml(p.description)}</td>

                <td>${escapeHtml(p.categories?.name||"-")}</td>

                <td>${escapeHtml(p.locations?.name||"-")}</td>

                <td><strong>${formatNumber(stock)}</strong> ${escapeHtml(p.unit||"")}</td>

                <td>${formatNumber(min)}</td>

                <td>${formatMoney(p.unit_cost)}</td>

                <td>${status}</td>

                <td>

                  <button
                    class="btn secondary"
                    onclick="editPart('${p.id}')">
                    Editar
                  </button>

                </td>

              </tr>

            `;

          }).join("")}

        </tbody>

      </table>

    </div>

  `;

}


function filterParts(){

  const search =
    document
      .getElementById("partSearch")
      .value
      .toLowerCase();

  const filtered =
    parts.filter(p=>
      String(p.code||"")
        .toLowerCase()
        .includes(search)
      ||
      String(p.description||"")
        .toLowerCase()
        .includes(search)
    );

  document.getElementById(
    "partsTableContainer"
  ).innerHTML =
    renderPartsArray(filtered);

}


function renderPartsArray(list){

  if(!list.length){

    return `
      <div class="empty">
        Nenhuma peça encontrada.
      </div>
    `;

  }

  const old = parts;

  parts = list;

  const html =
    renderPartsTable();

  parts = old;

  return html;

}


/* =========================================================
   MODAL PEÇA
========================================================= */

function openPartModal(id=null){

  document
    .getElementById("partModal")
    .classList.remove("hidden");

  populatePartSelects();

  if(id){

    const p =
      parts.find(x=>x.id===id);

    if(!p) return;

    document.getElementById("partModalTitle")
      .textContent="Editar peça";

    document.getElementById("partId").value=p.id;
    document.getElementById("partCode").value=p.code||"";
    document.getElementById("partDescription").value=p.description||"";
    document.getElementById("partCategory").value=p.category_id||"";
    document.getElementById("partLocation").value=p.location_id||"";
    document.getElementById("partUnit").value=p.unit||"UN";
    document.getElementById("partCost").value=p.unit_cost||0;
    document.getElementById("partMin").value=p.min_stock||0;
    document.getElementById("partMax").value=p.max_stock||0;
    document.getElementById("partReorder").value=p.reorder_point||0;
    document.getElementById("partCriticality").value=p.criticality||"Média";

  }
  else{

    document.getElementById("partModalTitle")
      .textContent="Nova peça";

    document.getElementById("partForm").reset();

    document.getElementById("partId").value="";

    document.getElementById("partUnit").value="UN";

  }

}


function closePartModal(){

  document
    .getElementById("partModal")
    .classList.add("hidden");

}


function populatePartSelects(){

  document.getElementById("partCategory").innerHTML =
    '<option value="">Selecione...</option>' +
    categories.map(c=>
      `<option value="${c.id}">
        ${escapeHtml(c.name)}
      </option>`
    ).join("");

  document.getElementById("partLocation").innerHTML =
    '<option value="">Selecione...</option>' +
    locations.map(l=>
      `<option value="${l.id}">
        ${escapeHtml(l.name)}
      </option>`
    ).join("");

}


document
.getElementById("partForm")
.addEventListener("submit",async e=>{

  e.preventDefault();

  const id =
    document.getElementById("partId").value;

  const payload = {

    code:
      document.getElementById("partCode").value.trim(),

    description:
      document.getElementById("partDescription").value.trim(),

    category_id:
      document.getElementById("partCategory").value || null,

    location_id:
      document.getElementById("partLocation").value || null,

    unit:
      document.getElementById("partUnit").value.trim() || "UN",

    min_stock:
      Number(document.getElementById("partMin").value||0),

    max_stock:
      Number(document.getElementById("partMax").value||0),

    reorder_point:
      Number(document.getElementById("partReorder").value||0),

    unit_cost:
      Number(document.getElementById("partCost").value||0),

    criticality:
      document.getElementById("partCriticality").value,

    updated_at:
      new Date().toISOString()

  };

  let result;

  if(id){

    result =
      await supabaseClient
        .from("parts")
        .update(payload)
        .eq("id",id);

  }
  else{

    payload.current_stock=0;

    result =
      await supabaseClient
        .from("parts")
        .insert(payload);

  }

  if(result.error){

    alert(
      "Erro ao salvar peça:\n" +
      result.error.message
    );

    return;
  }

  closePartModal();

  await loadParts();

  showPage("parts");

});


function editPart(id){

  openPartModal(id);

}


/* =========================================================
   MOVIMENTAÇÕES
========================================================= */

function renderMovements(){

  content.innerHTML = `

    <div class="panel">

      <div class="panel-header">

        <div class="panel-title">
          Histórico de movimentações
        </div>

        <button class="btn"
          onclick="openMovementModal()">
          + Nova movimentação
        </button>

      </div>

      <div class="toolbar">

        <input
          id="movementSearch"
          placeholder="Pesquisar peça..."
          oninput="filterMovements()">

      </div>

      <div id="movementsContainer">

        ${renderMovementsTable()}

      </div>

    </div>

  `;

}


function renderMovementsTable(limit=null){

  let list=[...movements];

  if(limit)
    list=list.slice(0,limit);

  if(!list.length){

    return `
      <div class="empty">
        Nenhuma movimentação registrada.
      </div>
    `;

  }

  return `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Data</th>
            <th>Peça</th>
            <th>Tipo</th>
            <th>Quantidade</th>
            <th>Antes</th>
            <th>Depois</th>
            <th>Documento</th>
            <th>Equipamento</th>
            <th>OM</th>
          </tr>

        </thead>

        <tbody>

          ${list.map(m=>{

            let cls="blue";

            if(m.movement_type==="Entrada")
              cls="green";

            if(m.movement_type==="Saída")
              cls="red";

            if(m.movement_type==="Devolução")
              cls="green";

            if(m.movement_type==="Ajuste")
              cls="yellow";

            return `

              <tr>

                <td>
                  ${formatDate(m.movement_date)}
                </td>

                <td>
                  <strong>
                    ${escapeHtml(m.parts?.code||"")}
                  </strong>
                  <br>
                  ${escapeHtml(m.parts?.description||"")}
                </td>

                <td>
                  <span class="badge ${cls}">
                    ${escapeHtml(m.movement_type)}
                  </span>
                </td>

                <td>
                  ${formatNumber(m.quantity)}
                </td>

                <td>
                  ${formatNumber(m.stock_before)}
                </td>

                <td>
                  ${formatNumber(m.stock_after)}
                </td>

                <td>
                  ${escapeHtml(m.document_number||"-")}
                </td>

                <td>
                  ${escapeHtml(m.equipment||"-")}
                </td>

                <td>
                  ${escapeHtml(m.maintenance_order||"-")}
                </td>

              </tr>

            `;

          }).join("")}

        </tbody>

      </table>

    </div>

  `;

}


function filterMovements(){

  const search =
    document
      .getElementById("movementSearch")
      .value
      .toLowerCase();

  const filtered =
    movements.filter(m=>
      String(m.parts?.code||"")
        .toLowerCase()
        .includes(search)
      ||
      String(m.parts?.description||"")
        .toLowerCase()
        .includes(search)
    );

  const old=movements;

  movements=filtered;

  document.getElementById(
    "movementsContainer"
  ).innerHTML =
    renderMovementsTable();

  movements=old;

}


/* =========================================================
   MODAL MOVIMENTAÇÃO
========================================================= */

function openMovementModal(){

  document
    .getElementById("movementModal")
    .classList.remove("hidden");

  document
    .getElementById("movementForm")
    .reset();

  document.getElementById("movementPart").innerHTML =
    '<option value="">Selecione a peça...</option>' +

    parts
      .filter(p=>p.active!==false)
      .map(p=>
        `<option value="${p.id}">
          ${escapeHtml(p.code)} - ${escapeHtml(p.description)}
        </option>`
      ).join("");

}


function closeMovementModal(){

  document
    .getElementById("movementModal")
    .classList.add("hidden");

}


document
.getElementById("movementForm")
.addEventListener("submit",async e=>{

  e.preventDefault();

  const partId =
    document.getElementById("movementPart").value;

  const type =
    document.getElementById("movementType").value;

  const quantity =
    Number(
      document.getElementById("movementQuantity").value
    );

  if(!partId || quantity<=0){

    alert("Informe a peça e uma quantidade válida.");

    return;
  }

  const part =
    parts.find(p=>p.id===partId);

  if(!part){

    alert("Peça não encontrada.");

    return;
  }

  const before =
    Number(part.current_stock||0);

  let after=before;

  if(type==="Entrada")
    after=before+quantity;

  if(type==="Devolução")
    after=before+quantity;

  if(type==="Saída")
    after=before-quantity;

  if(type==="Ajuste")
    after=quantity;

  if(after<0){

    alert(
      "A movimentação não pode deixar o estoque negativo."
    );

    return;
  }

  const cost =
    Number(
      document.getElementById("movementCost").value ||
      part.unit_cost ||
      0
    );

  const movement = {

    part_id:partId,

    movement_type:type,

    quantity:quantity,

    unit_cost:cost,

    stock_before:before,

    stock_after:after,

    document_number:
      document.getElementById("movementDocument").value.trim() || null,

    reason:
      document.getElementById("movementReason").value.trim() || null,

    equipment:
      document.getElementById("movementEquipment").value.trim() || null,

    maintenance_order:
      document.getElementById("movementOrder").value.trim() || null,

    created_by:
      currentUser?.id || null,

    movement_date:
      new Date().toISOString()

  };

  const insertResult =
    await supabaseClient
      .from("stock_movements")
      .insert(movement);

  if(insertResult.error){

    alert(
      "Erro ao registrar movimentação:\n" +
      insertResult.error.message
    );

    return;
  }

  const updateResult =
    await supabaseClient
      .from("parts")
      .update({
        current_stock:after,
        updated_at:new Date().toISOString()
      })
      .eq("id",partId);

  if(updateResult.error){

    alert(
      "A movimentação foi registrada, mas houve erro ao atualizar o saldo:\n" +
      updateResult.error.message
    );

    return;
  }

  closeMovementModal();

  await loadAll();

  showPage("movements");

  alert("Movimentação registrada com sucesso.");

});


/* =========================================================
   ESTOQUE CRÍTICO
========================================================= */

function renderCritical(){

  const critical =
    parts.filter(p=>
      Number(p.current_stock||0)
      <=
      Number(p.min_stock||0)
    );

  content.innerHTML = `

    <div class="panel">

      <div class="panel-header">

        <div class="panel-title">
          Peças abaixo ou no estoque mínimo
        </div>

      </div>

      ${
        critical.length
        ? renderPartsArray(critical)
        : `
          <div class="empty">
            ✅ Nenhuma peça está em situação crítica.
          </div>
        `
      }

    </div>

  `;

}


/* =========================================================
   INDICADORES
========================================================= */

function renderIndicators(){

  const total =
    parts.length;

  const critical =
    parts.filter(p=>
      Number(p.current_stock||0)
      <=
      Number(p.min_stock||0)
    ).length;

  const normal =
    total-critical;

  const stock =
    parts.reduce(
      (s,p)=>s+Number(p.current_stock||0),
      0
    );

  const value =
    parts.reduce(
      (s,p)=>
        s+
        Number(p.current_stock||0)*
        Number(p.unit_cost||0),
      0
    );

  const entradas =
    movements
      .filter(m=>m.movement_type==="Entrada")
      .reduce((s,m)=>s+Number(m.quantity||0),0);

  const saidas =
    movements
      .filter(m=>m.movement_type==="Saída")
      .reduce((s,m)=>s+Number(m.quantity||0),0);

  content.innerHTML = `

    <div class="cards">

      <div class="card orange">
        <div class="card-title">Total de peças</div>
        <div class="card-value">${total}</div>
      </div>

      <div class="card green">
        <div class="card-title">Peças normais</div>
        <div class="card-value">${normal}</div>
      </div>

      <div class="card red">
        <div class="card-title">Peças críticas</div>
        <div class="card-value">${critical}</div>
      </div>

      <div class="card blue">
        <div class="card-title">Quantidade em estoque</div>
        <div class="card-value">${formatNumber(stock)}</div>
      </div>

    </div>

    <div class="cards">

      <div class="card green">
        <div class="card-title">Valor do estoque</div>
        <div class="card-value">
          ${formatMoney(value)}
        </div>
      </div>

      <div class="card blue">
        <div class="card-title">Total de entradas</div>
        <div class="card-value">
          ${formatNumber(entradas)}
        </div>
      </div>

      <div class="card red">
        <div class="card-title">Total de saídas</div>
        <div class="card-value">
          ${formatNumber(saidas)}
        </div>
      </div>

      <div class="card orange">
        <div class="card-title">Movimentações</div>
        <div class="card-value">
          ${movements.length}
        </div>
      </div>

    </div>

    <div class="panel">

      <div class="panel-title">
        Situação do estoque
      </div>

      <br>

      <p>
        <strong>${normal}</strong> peças em situação normal.
      </p>

      <p>
        <strong>${critical}</strong> peças precisam de atenção.
      </p>

    </div>

  `;

}

/* =========================================================
   UTILITÁRIOS
========================================================= */

function formatNumber(value){

  return Number(value||0)
    .toLocaleString("pt-BR",{
      maximumFractionDigits:2
    });

}


function formatMoney(value){

  return Number(value||0)
    .toLocaleString("pt-BR",{
      style:"currency",
      currency:"BRL"
    });

}


function formatDate(value){

  if(!value) return "-";

  return new Date(value)
    .toLocaleString("pt-BR");

}


function escapeHtml(value){

  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

checkSession();
